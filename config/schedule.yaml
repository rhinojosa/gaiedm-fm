timezone: local

# Deep House & Progressive House Radio Station
# Music-first format: continuous DJ-mixed tracks with short DJ interjections.

shows:
  the_deep:
    name: "The Deep"
    description: "Warm, melodic deep house. Anjunadeep vibes — Lane 8, Ben Böhmer, Yotto, Tinlicker, Rufus Du Sol."
    host: "dj_cascade"
    topic_focus: "melodic_house"
    segment_types: ["track_intro", "set_intro", "set_outro", "artist_spotlight", "festival_update", "station_id"]
    bumper_style: "deep_house"
    bpm_range: [118, 124]
    music_genres: ["deep house", "melodic house", "organic house"]
    crossfade_beats: 32
    dj_frequency: 4          # DJ speaks every N tracks
    anthem_enabled: true
    anthem_frequency: 4       # play anthem every N tracks
    voices:
      host: "am_michael"

  frequencies:
    name: "Frequencies"
    description: "Dark, hypnotic progressive house. Digweed, Sasha, Deep Dish, Hernan Cattaneo, Guy J."
    host: "dj_echo"
    topic_focus: "progressive_house"
    segment_types: ["track_intro", "set_intro", "set_outro", "artist_spotlight", "station_id"]
    bumper_style: "progressive"
    bpm_range: [122, 128]
    music_genres: ["progressive house", "dark progressive", "melodic techno"]
    crossfade_beats: 32
    dj_frequency: 6          # less talk, let the music breathe
    anthem_enabled: true
    anthem_frequency: 4
    voices:
      host: "am_onyx"

  anthem_hour:
    name: "Anthem Hour"
    description: "Peak-time anthems and festival energy. Prydz, Deadmau5, Above & Beyond, CamelPhat, Artbat."
    host: "dj_neon"
    topic_focus: "anthems"
    segment_types: ["track_intro", "set_intro", "set_outro", "anthem_announce", "festival_update", "station_id"]
    bumper_style: "anthem"
    bpm_range: [124, 130]
    music_genres: ["progressive house", "melodic techno", "trance"]
    crossfade_beats: 16       # tighter transitions for high energy
    dj_frequency: 3           # more hype, more talk
    anthem_enabled: true
    anthem_frequency: 1       # every track is anthem-tier
    voices:
      host: "af_bella"


# Weekly schedule.
# - `base` applies every day.
# - `overrides` replace the base when day+time match.
schedule:
  base:
    - start: "00:00"
      end: "06:00"
      show: "the_deep"
    - start: "06:00"
      end: "12:00"
      show: "the_deep"
    - start: "12:00"
      end: "18:00"
      show: "frequencies"
    - start: "18:00"
      end: "22:00"
      show: "anthem_hour"
    - start: "22:00"
      end: "00:00"
      show: "frequencies"

  overrides:
    # Friday & Saturday late night = Frequencies (underground feel)
    - days: ["fri", "sat"]
      start: "00:00"
      end: "06:00"
      show: "frequencies"
    # Sunday afternoon = The Deep (chill recovery)
    - days: ["sun"]
      start: "12:00"
      end: "18:00"
      show: "the_deep"
